version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/plugin-react"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
    groups:
      documentation:
        patterns:
          - "*"
  - package-ecosystem: composer
    directory: /tests/fixtures/laravel
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
