name: Feature request
description: Propose a concrete improvement to the PHP / Laravel workflow.
labels: [enhancement, "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, start a discussion first. A feature request describes a specific problem and proposed behavior.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user experience, including keyboard access when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: textarea
    id: scope
    attributes:
      label: Additional context
      description: Examples, mockups, or compatibility requirements. Share only material you may redistribute.
