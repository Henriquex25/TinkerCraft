name: Build Linux release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate main and version consistency
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Run releases from main after merging a reviewed PR.')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use MAJOR.MINOR.PATCH without a v prefix.')
          if Path('VERSION').read_text().strip() != version:
              raise SystemExit('The release version must match VERSION in this commit.')
          for filename in ['package.json', 'package-lock.json', 'frontend/package.json', 'frontend/package-lock.json']:
              data = json.loads(Path(filename).read_text())
              if data['version'] != version or ('packages' in data and data['packages']['']['version'] != version):
                  raise SystemExit('Update the version in ' + filename + ' before releasing.')
          PY
      - name: Require successful CI for the exact commit
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs | length')"
          if [[ "$count" -eq 0 ]]; then
            echo 'Wait for the CI push run on this exact main commit to succeed before releasing.' >&2
            exit 1
          fi

  build:
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            webkit_package: libwebkit2gtk-4.0-dev
            variant: webkit40
            webkit: "4.0"
          - os: ubuntu-24.04
            webkit_package: libwebkit2gtk-4.1-dev
            variant: webkit41
            webkit: "4.1"
    runs-on: ${{ matrix.os }}
    env:
      TINKERCRAFT_VERSION: ${{ inputs.version }}
      TINKERCRAFT_WEBKIT: ${{ matrix.webkit }}
      TINKERCRAFT_RELEASE_SOURCE: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          extensions: mbstring, dom, sqlite3, curl
          coverage: none
      - name: Install Linux build dependencies
        env:
          WEBKIT_PACKAGE: ${{ matrix.webkit_package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev "$WEBKIT_PACKAGE" dpkg-dev desktop-file-utils python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common
      - name: Install locked frontend and test dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - run: ./scripts/install-phpactor.sh
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build Debian package
        run: ./scripts/package-linux.sh
      - name: Validate source and package
        env:
          TINKERCRAFT_PHPACTOR_REAL: ${{ github.workspace }}/.tools/phpactor.phar
        run: |
          if [[ "$TINKERCRAFT_WEBKIT" == "4.1" ]]; then
            go test -tags webkit2_41 ./...
            go vet -tags webkit2_41 ./...
          else
            go test ./...
            go vet ./...
          fi
          node tests/render.test.mjs
          node tests/formatter.test.mjs
          python3 tests/distribution.test.py
          python3 tests/community.test.py
          cd build/dist
          sha256sum -c checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-amd64-${{ matrix.variant }}
          path: build/dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: packages
      - name: Prepare release files
        run: python3 scripts/prepare-release.py "$RELEASE_VERSION" "$RELEASE_SOURCE" packages release-assets
      - name: Create draft for review
        run: gh release create "v$RELEASE_VERSION" release-assets/* --draft --title "TinkerCraft $RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
